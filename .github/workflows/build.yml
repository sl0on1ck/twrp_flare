name: Build TWRP for flare

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "TWRP manifest branch"
        required: true
        default: "twrp-14.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python3-pip bc repo lz4
          pip3 install pyyaml

      - name: Setup workspace
        run: |
          mkdir -p ~/workdir && cd ~/workdir
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.manifest_branch }}

      - name: Sync sources
        working-directory: ~/workdir
        run: |
          repo sync -c -j4 --no-clone-bundle --no-tags --fail-fast

      - name: Copy device tree
        run: |
          mkdir -p ~/workdir/device/xiaomi/
          cp -r $GITHUB_WORKSPACE/flare ~/workdir/device/xiaomi/

      - name: Build recovery
        working-directory: ~/workdir
        run: |
          source build/envsetup.sh
          lunch twrp_flare-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-flare
          path: |
            ~/workdir/out/target/product/flare/recovery.img
            ~/workdir/out/target/product/flare/vendor_boot.img
          if-no-files-found: error
